[Config]
InputMode=0
CandVertical=1
CandCount=9
EnablePunction=0
TradChinese=0
UseGBK=1
SortMode=0
Level1Mode=2

; ——— 按应用覆盖（可选）———
; 同一输入法在不同程序里用不同配置：每个进程各读一次，改完需重启该程序
;
; [app:notepad.exe]
; TradChinese=1
; CandVertical=0
; CandCount=5
;
; [app:*]
; Level1Mode=0
; ——— 候选框外观 ———
; CandFont     字号（8-24）
; CandBgColor  背景色，支持 #RRGGBB / 0xRRGGBB / 十进制
; CandInset    1=内框凹陷效果 0=关闭
; 这些也可以放进 [app:<exe>] 小节里按程序区分
CandFont=14
CandBgColor=#F7F9FC
CandInset=1
; ——— 词库选择（对比手感用）———
; data 目录下的词库文件名，可在设置窗口的下拉框里选
;   dict-rime.bin  = 纯 Rime 词库（13.6 万条，词频完整）
;   dict-qq.bin    = 纯 QQ 五笔词库（1.1 万条，词条短、常用词多）
;   qqwubi86.dict.tsv = 两者合并（默认，1477 万权重排序）
DictFile=qqwubi86.dict.tsv